name: Keep Supabase awake

# Free Supabase projects pause after ~1 week of inactivity. This runs a tiny
# read every 3 days so the shop's backend stays live.

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC, every 3 days
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Light read against Supabase
        env:
          SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error \
            "$SUPABASE_URL/rest/v1/filament_colors?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "Supabase pinged OK"
